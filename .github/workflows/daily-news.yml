name: 매일 자동 블로그 포스팅

on:
  schedule:
    - cron: '0 23 * * *'
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  generate-daily-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 20

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 오늘 포스트 존재 여부 확인
        id: check
        run: |
          echo "skip=false" >> $GITHUB_OUTPUT

          # 수동 실행은 항상 생성한다
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "수동 실행 - 가드 건너뜀"
            exit 0
          fi

          # 스케줄 실행일 때만 오늘(KST) 자동 포스트가 이미 있는지 확인
          TODAY=$(TZ=Asia/Seoul date +'%Y-%m-%d')
          echo "기준 날짜(KST): ${TODAY}"
          if ls posts/daily-${TODAY}-*.json >/dev/null 2>&1; then
            echo "오늘(${TODAY}) 포스트가 이미 있습니다 - 건너뜀"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "오늘(${TODAY}) 포스트 없음 - 생성 진행"
          fi

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: npm install axios cheerio

      - name: Fetch news and create post
        if: steps.check.outputs.skip != 'true'
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/fetch-news.js

      - name: Commit and push if changed
        if: steps.check.outputs.skip != 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A

          if git diff --staged --quiet; then
            echo "변경 사항 없음 - 종료"
            exit 0
          fi

          git commit -m "오늘의 포스트: $(TZ=Asia/Seoul date +'%Y-%m-%d')"

          # GitHub 측 일시적 오류(commit_refs 등)에 대비해 최대 5회 재시도
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then
              echo "푸시 성공 (${i}회차)"
              exit 0
            fi
            echo "푸시 실패 - ${i}회차, 20초 후 재시도"
            sleep 20
          done

          echo "5회 재시도 후에도 푸시 실패 - 오늘 포스트가 발행되지 않았습니다."
          exit 1
